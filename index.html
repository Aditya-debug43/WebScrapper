<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Marketplace pricing intelligence prototype — product identity, listings, offers, price history, cross-marketplace analysis and pricing recommendations." />
    <meta name="theme-color" content="#edeeeb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0e11" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='3' fill='%2314161A'/%3E%3Cg stroke='%23FFFFFF' stroke-width='1.75' stroke-linecap='square'%3E%3Cpath d='M7 24h18'/%3E%3Cpath d='M10 24v-6'/%3E%3Cpath d='M16 24v-11'/%3E%3Cpath d='M22 24v-16'/%3E%3C/g%3E%3C/svg%3E" />

    <!--
      Three voices: Instrument Serif carries the argument, Instrument Sans
      carries the interface, IBM Plex Mono carries every figure the system
      asserts. See src/styles/tokens.css.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..600&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <title>Mulya — Marketplace Pricing Intelligence</title>

    <script>
      // Resolve the theme before first paint so a reader who has chosen dark
      // never sees a white flash on load.
      (function () {
        try {
          var saved = localStorage.getItem("mulya-theme");
          if (saved === "dark" || saved === "light") {
            document.documentElement.setAttribute("data-theme", saved);
          }
        } catch (e) {
          /* private mode — fall through to the system preference */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
